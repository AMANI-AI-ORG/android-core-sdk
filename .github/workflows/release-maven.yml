name: Release Maven versions

# Runs ONLY after a release pull request was approved: publish-on-approval.yml calls it right after
# the bot commit. It is never started by a push to main — a version folder pushed or merged to main
# directly gets no tag and no release (and fails a manual run), so nothing is released without an
# approved pull request. Manual run (workflow_dispatch) is for retries only and applies the same rule:
# a version is released only when the commit that added its folder is the release bot's
# ("Published from pull request #N") and the folder matches that pull request's head.
# The Maven repository is served straight from
# this repository (raw.githubusercontent.com/<owner>/<repo>/main/maven), so there is nothing to deploy:
# this workflow re-checks every version folder and maven-metadata.xml, checks that the raw URL serves
# exactly the bytes in SHA256SUMS, then creates the GitHub Release for every new version (backfilled
# versions get none). Re-running it is safe: existing releases are skipped.
#
# Release notes come from the '### Release notes' section of the pull request that added the version
# folder (scripts/maven_site.py notes); without it, the folder's RELEASE_NOTES.md is used.
#
# Repository variable PUBLIC_MAVEN_URL = the URL customers use. When it is empty,
# https://raw.githubusercontent.com/<this repository>/main/maven is used.

on:
  # No push trigger on purpose: a direct push or merge to main must not create tags or releases.
  # Retry of a failed run (same checks; only bot-published versions are released).
  workflow_dispatch:
  # Called by publish-on-approval.yml right after the bot commit (a push made with GITHUB_TOKEN does
  # not start other workflows).
  workflow_call:
    inputs:
      ref:
        description: Commit on main to release (the bot commit)
        type: string
        required: true
      before:
        description: main before that commit (folders added in between are the new ones)
        type: string
        required: true
      pr-number:
        description: Pull request whose "### Release notes" section is used
        type: string
        required: false
        default: ''

concurrency:
  group: release-maven
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          # Full history: the commit that added a version folder leads to its pull request.
          fetch-depth: 0

      - name: Verify every version folder and maven-metadata.xml
        run: |
          set -euo pipefail
          python3 -I scripts/maven_site.py verify maven
          python3 -I scripts/maven_site.py check-metadata maven

      - name: Check served files and create missing releases
        env:
          GH_TOKEN: ${{ github.token }}
          MAVEN_URL: ${{ vars.PUBLIC_MAVEN_URL }}
          BEFORE: ${{ inputs.before || github.event.before }}
          TARGET: ${{ inputs.ref || github.sha }}
          PR_NUMBER: ${{ inputs.pr-number }}
        run: |
          set -euo pipefail
          BASE="${MAVEN_URL:-https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/maven}"; BASE="${BASE%/}"
          python3 -I scripts/maven_site.py pending maven > "$RUNNER_TEMP/versions.jsonl"
          failed=0
          # approved_pr <dir>: the commit that added <dir>/release.json must be the release bot's commit
          # from publish-on-approval.yml ("Published from pull request #N", author and committer
          # github-actions[bot]) and <dir> must be identical to that pull request's head. Sets
          # APPROVED_PR=N; otherwise prints the reason and returns 1 (the version is not released).
          approved_pr() {
            local dir="$1" c who n
            APPROVED_PR=""
            c="$(git log --diff-filter=A --format=%H -1 "$TARGET" -- "$dir/release.json")"
            [ -n "$c" ] || { echo "::error::$dir: no commit on main adds release.json — no release created."; return 1; }
            who="$(git show -s --format='%an|%cn' "$c")"
            n="$(git show -s --format=%B "$c" | sed -n 's/^Published from pull request #\([0-9][0-9]*\),.*/\1/p' | head -1)"
            if [ "$who" != "github-actions[bot]|github-actions[bot]" ] || [ -z "$n" ]; then
              echo "::error::$dir reached main in ${c:0:7} by ${who%%|*}, not through an approved release pull request (publish-on-approval.yml) — no tag or release created. Remove it from main and open a release PR."
              return 1
            fi
            if [ -n "${PR_NUMBER:-}" ] && [ "$PR_NUMBER" != "$n" ]; then
              echo "::error::$dir was published from pull request #$n, not #$PR_NUMBER — no release created."
              return 1
            fi
            git fetch --quiet --no-tags origin "+refs/pull/${n}/head:refs/remotes/pr/${n}" \
              || { echo "::error::$dir: pull request #$n cannot be fetched — no release created."; return 1; }
            git diff --quiet "$c" "refs/remotes/pr/${n}" -- "$dir" \
              || { echo "::error::$dir on main differs from pull request #$n — no release created."; return 1; }
            APPROVED_PR="$n"
          }

          # Folders added by this push (all of them on a manual run): backfilled versions have no
          # release to mark them done, so only the newly added ones are downloaded and checked.
          if [ -n "${BEFORE:-}" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            git diff --name-only --diff-filter=A "$BEFORE" "$TARGET" -- maven \
              | sed -n 's#/release\.json$##p' > "$RUNNER_TEMP/new-dirs.txt"
          else
            python3 -I scripts/maven_site.py pending maven | jq -r .dir > "$RUNNER_TEMP/new-dirs.txt"
          fi

          while read -r line; do
            dir="$(jq -r .dir <<<"$line")";        tag="$(jq -r .tag <<<"$line")"
            version="$(jq -r .version <<<"$line")"; artifact="$(jq -r .artifactId <<<"$line")"
            pre="$(jq -r .prerelease <<<"$line")";  backfilled="$(jq -r .backfilled <<<"$line")"
            if [ "$backfilled" = "true" ]; then
              grep -qxF "$dir" "$RUNNER_TEMP/new-dirs.txt" || continue
            elif gh release view "$tag" >/dev/null 2>&1; then
              continue
            else
              # A tag and a release only for versions that came through an approved release PR.
              approved_pr "$dir" || { failed=1; continue; }
            fi

            # The URL customers use must serve exactly the bytes in SHA256SUMS — for every version,
            # backfilled ones included. raw.githubusercontent.com caches for a few minutes.
            aar="${artifact}-${version}.aar"
            expected="$(awk -v f="$aar" '$2==f || $2=="*"f {print $1}' "$dir/SHA256SUMS")"
            url="${BASE}/${dir#maven/}/${aar}"
            ok=0
            for i in $(seq 1 20); do
              if curl -fsSL -o "$RUNNER_TEMP/served.aar" "$url" \
                 && [ "$(sha256sum "$RUNNER_TEMP/served.aar" | cut -d' ' -f1)" = "$expected" ]; then
                ok=1; break
              fi
              echo "Waiting for $url ($i/20)…"; sleep 30
            done
            if [ "$ok" != 1 ]; then
              echo "::error::$url is not served with SHA-256 $expected after 10 minutes. No release created for $tag."
              failed=1; continue   # the other versions still get their release; the job fails at the end
            fi
            [ "$backfilled" = "true" ] && continue   # backfilled: served and checked, no tag or release

            files=("$dir/$aar" "$dir/${artifact}-${version}.pom" "$dir/SHA256SUMS")
            for extra in "${artifact}-${version}-sources.jar" "${artifact}-${version}.module"; do
              [ -f "$dir/$extra" ] && files+=("$dir/$extra")
            done
            # Release notes: the '### Release notes' section of the approved pull request that added
            # this folder (badges for fix/feature/improvement/update/change), else RELEASE_NOTES.md.
            # The bot commit is not linked to the PR by GitHub: the number comes from its message.
            : > "$RUNNER_TEMP/pr-body.md"
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${APPROVED_PR}" --jq '.body // ""' > "$RUNNER_TEMP/pr-body.md" 2>/dev/null \
              || { echo "::warning::Could not read PR #${APPROVED_PR} — using RELEASE_NOTES.md"; : > "$RUNNER_TEMP/pr-body.md"; }
            python3 -I scripts/maven_site.py notes "$dir" --pr-body-file "$RUNNER_TEMP/pr-body.md" \
              --maven-url "$BASE" > "$RUNNER_TEMP/notes.md"
            # No --latest for stable versions: GitHub then keeps the highest version as Latest, so a
            # hotfix on an older line does not take it over.
            flags=(--target "$TARGET" --title "$tag" --notes-file "$RUNNER_TEMP/notes.md")
            if [ "$pre" = "true" ]; then flags+=(--prerelease --latest=false); fi
            gh release create "$tag" "${files[@]}" "${flags[@]}"
            echo "Released $tag — $url" >> "$GITHUB_STEP_SUMMARY"
          done < "$RUNNER_TEMP/versions.jsonl"
          exit "$failed"
